<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiyim o'lchamlarini aniqlash</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>👕 Kiyim o'lchamlarini aniqlash</h1>

    <p class="description">
        Bo'yingiz va vazningizni kiriting.
        Sizga mos kiyim o'lchamlarini aniqlaymiz.
    </p>

    <label for="height">Bo'yingiz (sm)</label>
    <input
        type="number"
        id="height"SSSSSSS
        placeholder="Masalan: 175"
    >

    <label for="weight">Vazningiz (kg)</label>
    <input
        type="number"
        id="weight"
        placeholder="Masalan: 70"
    >

    <button onclick="calculateSize()">
        Olchovini aniqlash
    </button>

    <p id="error" class="error">
        Iltimos, ma'lumotlarni to'g'ri kiriting!
    </p>

    <div id="result">

        <h2>Sizga mos o'lchamlar</h2>

        <div class="item">
            <span>👕 Futbolka</span>
            <strong id="tshirt"></strong>
        </div>

        <div class="item">
            <span>👔 Ko'ylak</span>
            <strong id="shirt"></strong>
        </div>

        <div class="item">
            <span>🧥 Kurtka</span>
            <strong id="jacket"></strong>
        </div>

        <div class="item">
            <span>👖 Shim</span>
            <strong id="pants"></strong>
        </div>

        <div class="item">
            <span>🩳 Shortik</span>
            <strong id="shorts"></strong>
        </div>

        <div class="item">
            <span>🧦 Paypoq</span>
            <strong id="socks"></strong>
        </div>

        <div class="item">
            <span>👟 Oyoq kiyim</span>
            <strong id="shoes"></strong>
        </div>

        <div class="item">
            <span>🧢 Bosh kiyim</span>
            <strong id="cap"></strong>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
